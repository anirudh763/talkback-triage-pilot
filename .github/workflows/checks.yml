name: checks

on:
  push:
  pull_request:

# The checks only read the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change what runs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dev dependencies
        run: npm ci
      - name: Answer parser and statistics
        run: node test/core.test.js
      - name: Report checker, issue form, workflow guards, slow-input and triage-call tests
        run: |
          node test/checker.test.js
          node test/workflow.test.js
          node test/talkback-action.test.js
          node test/copy.test.js
          node test/issue-form.test.js
          node test/redos.test.js
          node test/triage-call.test.js
      - name: Checklist and clean-copy check
        run: node scripts/check.js --quiet
      - name: Rebuild generated files
        run: |
          node scripts/pair-review.js
          node scripts/build.js
      - name: Generated files are up to date
        run: git diff --exit-code -- data/issues.json results/pair_review.md docs/
      - name: Version matches the changelog
        run: node test/version.test.js
      - name: Analysis runs
        run: node scripts/analyze.js
      - name: Browser tests (study flows, report checker, axe-core, 320px, offline, no JavaScript)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  http-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install HTTP runtime test dependencies
        run: python -m pip install -r requirements-web.txt pytest
      - name: HTTP runtime security, routing and lifecycle regressions
        run: python -m pytest -q test/http_server_regression.py
